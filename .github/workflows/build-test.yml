name: Build and test

on:
  pull_request:
    branches:
      - main
    # The workflow is skipped if every file that the pull request changes matches
    # one of these patterns. A change to any of these files cannot affect the tests.
    paths-ignore:
      - "**.md"
      - "examples/**"
      - ".agents/**"
      - ".claude/**"
      - "LICENSE.txt"
      - ".pre-commit-config.yaml"
      - ".github/release-drafter.yml"
      - ".github/workflows/draft-release-notes.yml"
      - ".github/workflows/pre-commit.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

# A push to a pull request cancels any run in progress for an earlier push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-and-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked --group test --no-dev
      # Without `--no-sync`, `uv run` would sync the environment with the dev group.
      - name: Run tests
        run: uv run --no-sync -- pytest

      - name: Set up minimum environment
        shell: bash
        run: |
          if [ "${{ matrix.python-version }}" == "3.14" ]; then
            GROUP="test_py14"
          else
            GROUP="test"
          fi
          uv lock --resolution lowest-direct
          uv sync --frozen --resolution lowest-direct --group "$GROUP" --no-dev
      # `--no-sync` runs the tests against the environment as set up above. Without
      # it, `uv run` would re-lock the project and upgrade the dependencies to their
      # latest versions.
      - name: Run tests for minimum environment
        run: |
          uv run --no-sync -- pytest
          uv pip list
